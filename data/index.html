<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Lamp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>ESP32 "Blazar" Lamp</h1></header>
  <main>
    <div class="mode-selector">
      <label for="mode">Lamp Mode</label>
      <select id="mode" onchange="handleModeChange(this.value)">
        <option value="mode_blazar" selected>Blazar</option>
        <option value="mode_console">Console</option>
        <option value="mode_hsv">HSV (nw)</option>
        <option value="mode_other">Other (nw)</option>
      </select>
    </div>

    <!-- Blazar Lamp Mode Controls -->
    <div id="mode_blazar-controls" class="mode-controls">
      <div class="button-grid">
        <button class="color-button" style="--color: #ff0000; background-color: var(--color);" onclick="handleColorButtonClick(this)">Ruby</button>
        <button class="color-button" style="--color: #ff00ea; background-color: var(--color);" onclick="handleColorButtonClick(this)">Cat</button>
        <button class="color-button" style="--color: #ffa000; background-color: var(--color);" onclick="handleColorButtonClick(this)">Fire</button>
        <button class="color-button" style="--color: #2cff02; background-color: var(--color);" onclick="handleColorButtonClick(this)">Eco</button>
        <button class="color-button" style="--color: #02eaff; background-color: var(--color);" onclick="handleColorButtonClick(this)">Teal</button>
        <button class="color-button" style="--color: #ff9b02; background-color: var(--color);" onclick="handleColorButtonClick(this)">Sunny</button>
        <button class="color-button" style="--color: #ffffff; background-color: var(--color);" onclick="handleColorButtonClick(this)">Flat White</button>
        <button class="color-button" style="--color: #000000; color: #ffffff; background-color: var(--color);" onclick="handleColorButtonClick(this)">OFF</button>
      </div>
      <br>
      <div class="flicker-controls">
        <label class="flicker-toggle">Flicker<input type="checkbox" id="flicker-toggle" onclick="handleFlickerToggle(this)"></label>
        <div id="flicker-fields" style="display: none;">
          <label class="slider-row">Hue Amplitude<input type="number" min="0" max="255" value="30" style="width: 7ch;" onchange="handleFlickerParamChange(this, 'hue_ampl')"></label>
          <label class="slider-row">Hue TimeScale<input type="number" min="0" max="3000" value="200" style="width: 7ch;" onchange="handleFlickerParamChange(this, 'hue_ts')"></label>
          <br>
          <label class="slider-row">Brt Amplitude<input type="number" min="0" max="255" value="0" style="width: 7ch;" onchange="handleFlickerParamChange(this, 'brt_ampl')"></label>
          <label class="slider-row">Brt TimeScale<input type="number" min="0" max="3000" value="100" style="width: 7ch;" onchange="handleFlickerParamChange(this, 'brt_ts')"></label>
        </div>
      </div>
    </div>

    <!-- TV Console Mode Controls -->
    <div id="mode_console-controls" class="mode-controls" style="display: none;">
      <label class="mirror-toggle">Mirror Blazar Color<input type="checkbox" id="mirror-toggle" onclick="handleMirrorToggle(this)"></label>
      <div class="slider-row">
        <label for="hue-channel">Hue</label>
        <input type="range" id="hue-channel" min="0" max="255" value="200" onchange="handleTvConsoleSliderChange(this, 'hue')">
      </div>
      <div class="slider-row">
        <label for="val-channel">Brightness</label>
        <input type="range" id="val-channel" min="0" max="255" value="96" onchange="handleTvConsoleSliderChange(this, 'val')">
      </div>
      <div class="slider-row">
        <label for="sat-channel">Saturation</label>
        <input type="range" id="sat-channel" min="0" max="255" value="255" onchange="handleTvConsoleSliderChange(this, 'sat')">
      </div>
    </div>

    <!-- HSV Mode Controls do nothing -->
    <div id="mode_hsv-controls" class="mode-controls" style="display: none;">
      <div class="slider-row">
        <label for="hue-slider">Hue</label>
        <input type="range" id="hue-slider" min="0" max="360" value="180">
      </div>
      <div class="slider-row">
        <label for="saturation-slider">Saturation</label>
        <input type="range" id="saturation-slider" min="0" max="100" value="80">
      </div>
      <div class="slider-row">
        <label for="value-slider">Value</label>
        <input type="range" id="value-slider" min="0" max="100" value="90">
      </div>
    </div>

    <script src="script.js"></script>
  </main>
</body>
</html>
