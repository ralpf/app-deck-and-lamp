<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Lamp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>ESP32 TV Wall</h1></header>
  <main>

    <!-- Main Selector Dropdown -->
    <div class="dropdown-big">
      <label for="main-dropdown">Device Control</label>
      <select id="main-dropdown" onchange="Main.ModeChanged(this.value)">
        <option value="_mode_blazar" selected>Blazar</option>
        <option value="_mode_console">Console</option>
        <option value="_mode_global">Globals</option>
        <option value="_mode_other">Other (nw)</option>
      </select>
    </div>


    <!------------------------------------------------- Blazar Lamp Mode Controls -->
    <div id="_mode_blazar_controls" class="mode-controls">

      <div class="control-inrow">
        <label for="val-channel">Brightness</label>
        <input type="range" id="val-channel" min="0" max="255" value="250" onchange="Blazar.OnParamChange(this, '', 'bright')">
      </div>
      <br><hr><br>

      <div class="button-grid">
        <button class="color-button" style="--color: #ff0000; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Ruby</button>
        <button class="color-button" style="--color: #ff00ea; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Cat</button>
        <button class="color-button" style="--color: #ffa000; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Fire</button>
        <button class="color-button" style="--color: #2cff02; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Eco</button>
        <button class="color-button" style="--color: #02eaff; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Teal</button>
        <button class="color-button" style="--color: #ff9b02; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Sunny</button>
        <button class="color-button" style="--color: #ffffff; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">Flat White</button>
        <button class="color-button" style="--color: #000000; color: #ffffff; background-color: var(--color);" onclick="Blazar.OnColorButton(this)">OFF</button>
      </div>
      <br>

      <div class="boxed-controls">
        <label class="toggle-norm">Flicker<input type="checkbox" id="toggle-norm" onclick="Blazar.FlickerToggle(this)"></label>
        <div id="flicker-fields" style="display: none;">
          <label class="control-inrow">Hue Amplitude<input type="number" min="0" max="255" value="30" style="width: 7ch;" onchange="Blazar.FlickerParamChange(this, 'hue_ampl')"></label>
          <label class="control-inrow">Hue TimeScale<input type="number" min="0" max="3000" value="200" style="width: 7ch;" onchange="Blazar.FlickerParamChange(this, 'hue_ts')"></label>
          <br>
          <label class="control-inrow">Brt Amplitude<input type="number" min="0" max="255" value="0" style="width: 7ch;" onchange="Blazar.FlickerParamChange(this, 'brt_ampl')"></label>
          <label class="control-inrow">Brt TimeScale<input type="number" min="0" max="3000" value="100" style="width: 7ch;" onchange="Blazar.FlickerParamChange(this, 'brt_ts')"></label>
        </div>
      </div>
    </div>


    <!------------------------------------------------- TV Console Mode Controls -->
    <div id="_mode_console_controls" class="mode-controls" style="display: none;">

      <div class="control-inrow">  <!-- label and control in one line -->
        <label for="submode_console">Type</label>  <!-- Submode select -->
        <select id="submode_console" class="dropdown-norm" onchange="TVConsole.OnSubmodeChanged(this.value)">
          <option value="_submode_mirror_blazar" selected>Mirror Blazar</option>
          <option value="_submode_palette">Palette</option>
          <option value="_submode_hsv">HSV</option>
        </select>
      </div>

      <div class="control-inrow">
        <label for="val-channel">Brightness</label>
        <input type="range" id="val-channel" min="0" max="255" value="128" onchange="TVConsole.OnParamChange(this, '', 'bright')">
      </div>
      
      <div class="control-inrow">
        <label for="blend-speed">Palette Blend N Speed</label>
        <input id="blend-speed" type="number" min="0" max="255" value="24" onchange="TVConsole.OnParamChange(this, '', 'blend')">
      </div>
      
      <br><br>

      <div id="_submode_mirror_blazar" style="display: none;">
      </div>

      <div id="_submode_hsv" style="display: none;">
        <div class="control-inrow">
          <label for="hue-channel">Hue</label>
          <input type="range" id="hue-channel" min="0" max="255" value="200" onchange="TVConsole.OnParamChange(this, 'hsv', 'hue')">
        </div>
        <div class="control-inrow">
          <label for="sat-channel">Saturation</label>
          <input type="range" id="sat-channel" min="0" max="255" value="255" onchange="TVConsole.OnParamChange(this, 'hsv', 'sat')">
        </div>
      </div>

      <div id="_submode_palette" style="display: none;">
        <label>All Palettes</label>  <!-- List of available palletes; Will fill by script -->
        <br><br>
        <div class="toggle-norm">
          <label for="sat-channel">Randomize</label>
          <input type="checkbox" id="rand-idx" onchange="TVConsole.OnToggle(this)">
        </div>
        <div class="control-inrow">
        <label for="blend-speed">Animation N Speed</label>
        <input id="anim-speed" type="number" min="0" max="255" value="2" onchange="TVConsole.OnParamChange(this, '', 'anim')">
      </div>
        <br><hr>
        <div id="palette-list" class="button-list"></div>
      </div>
    </div>


    <!------------------------------------------------- GLOBAL Mode Controls -->
    <div id="_mode_global_controls" class="mode-controls" style="display: none;">
      <div class="control-inrow">
        <label for="_bright">Brightness</label>
        <input type="range" id="_bright" min="0" max="255" value="200" onchange="Main.OnParamChange(this, 'bright')">
      </div>
      <div class="control-inrow">
        <label for="_gamma">Gamma * 10</label>
        <input type="number" id="_gamma" min="1" max="50" value="20" onchange="Main.OnParamChange(this, 'gamma')">
      </div>
      <div class="control-inrow">
        <label for="_animSkip">Animation Skipped Frames</label>
        <input type="number" id="_animSkip" min="0" max="100" value="8" onchange="Main.OnParamChange(this, 'animSkip')">
      </div>
    </div>

    <script src="script.js"></script>
  </main>
</body>
</html>
